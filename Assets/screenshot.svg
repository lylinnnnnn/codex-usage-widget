<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Codex Usage Widget preview</title>
  <desc id="desc">A dark macOS desktop preview showing five-hour and weekly usage capsules with a Credits balance.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2130"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#background)"/>
  <text x="52" y="70" fill="#f5f7fb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="600">Codex Usage Widget</text>
  <text x="52" y="101" fill="#aeb6c8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">Local usage at a glance</text>
  <g transform="translate(570 82)">
    <rect x="0" y="0" width="250" height="390" rx="28" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(48 42)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
      <text x="32" y="18" fill="#ffffff" font-size="18" font-weight="600">72%</text>
      <rect x="20" y="42" width="24" height="210" rx="12" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="20" y="101" width="24" height="151" rx="12" fill="#ffffff" fill-opacity="0.95"/>
      <text x="32" y="282" fill="#d8dce6" font-size="16">5h</text>
    </g>
    <g transform="translate(138 42)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
      <text x="32" y="18" fill="#ffffff" font-size="18" font-weight="600">41%</text>
      <rect x="20" y="42" width="24" height="210" rx="12" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="20" y="166" width="24" height="86" rx="12" fill="#ffffff" fill-opacity="0.95"/>
      <text x="32" y="282" fill="#d8dce6" font-size="16">Weekly</text>
    </g>
    <rect x="35" y="338" width="180" height="36" rx="18" fill="#ffffff" fill-opacity="0.15"/>
    <text x="55" y="361" fill="#f1f3f8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Credits</text>
    <text x="195" y="361" fill="#f1f3f8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" text-anchor="end">500</text>
  </g>
  <text x="52" y="458" fill="#cbd1de" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">5h · Weekly · Credits</text>
  <text x="52" y="490" fill="#7f899d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Illustrative preview — values shown are sample data.</text>
</svg>
